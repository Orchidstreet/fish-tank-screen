<title>Fish Tank Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed WebGL stage. A caption and two controls float on the glass. Single dark look by choice. */
:root{
  --ink:#03080c;          /* page ground, behind the stage */
  --wall:#ccdbd8;         /* the wall the tank hangs on */
  --text:#f2f8f6;         /* caption text */
  --glow:#5ee9ff;         /* grid glow and focus ring */
  --pill:rgba(6,16,22,.72);
  --font-display:"Space Grotesk","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);overflow:hidden;font-family:var(--font-display)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding-block:0 calc(17% + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cap{margin:0;max-width:22em;text-align:center;text-wrap:balance;font-weight:700;letter-spacing:.01em;
  font-size:clamp(1.15rem,3.1vw,2.5rem);line-height:1.15;color:var(--text);
  text-shadow:0 2px 18px rgba(0,10,16,.85),0 0 2px rgba(0,10,16,.9);opacity:0;transition:opacity .7s ease}
.cap.on{opacity:1}
.ctl{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;opacity:0;transition:opacity .5s ease;pointer-events:none}
.awake .ctl{opacity:1;pointer-events:auto}
.ctl button{font:500 .8rem/1 var(--font-display);letter-spacing:.04em;color:var(--text);background:var(--pill);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.6em 1em;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ctl button:hover{border-color:var(--glow)}
.ctl button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hud,.ctl{display:none}
#stage{object-fit:contain}
.fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text);background:var(--ink);font-size:1.1rem}
</style>

<canvas id="stage" aria-label="A fish tank that appears to sit behind the screen"></canvas>
<div class="hud"><p id="cap" class="cap" aria-live="polite"></p></div>
<div class="ctl"><button id="replay" type="button">Replay</button><button id="full" type="button">Full screen</button></div>

<script>window.FILM_EXT=window.FILM_EXT||[];</script>
<!--EXT-->
<script>
/* set piece: ext_whale.js */
/* ext_whale.js : the whale shark set piece for the Fish Tank Screen film.
   A procedural whale shark (broad flat head, open terminal mouth, gills, ridges, fins, lunate tail),
   placed on ctx.paths.whale, swimming with a slow body wave. Replaces the placeholder fish (index 1). */
window.FILM_EXT=window.FILM_EXT||[];
window.FILM_EXT.push(function(ctx){
'use strict';
const gl=ctx.gl;
ctx.flags.baseWhale=false;

/* ================= geometry ================= */
// local frame: x forward (nose +1.45), y up, z = right side (forward x up)
// body stations from the throat (inside the open mouth) round the lips and back to the tail:
// [x, half width, top height, bottom depth, exponent top, exponent bottom]
const STN=[
 [1.19, .200, .000, .000, 2.0, 2.0],
 [1.25, .255, .016, .014, 2.2, 2.2],
 [1.31, .292, .024, .021, 2.4, 2.4],
 [1.37, .308, .028, .024, 2.6, 2.6],
 [1.418,.314, .030, .025, 2.7, 2.7],   // inner edge of the lips
 [1.441,.324, .041, .035, 2.7, 2.7],   // front of the lips
 [1.446,.338, .060, .050, 2.7, 2.6],
 [1.433,.351, .082, .062, 2.7, 2.6],
 [1.405,.361, .103, .073, 2.7, 2.55],
 [1.345,.369, .126, .084, 2.65,2.5],
 [1.245,.374, .150, .095, 2.6, 2.45],
 [1.10, .377, .180, .112, 2.55,2.4],
 [0.90, .375, .215, .135, 2.45,2.35],
 [0.60, .364, .268, .180, 2.3, 2.3],
 [0.30, .338, .310, .215, 2.2, 2.25],
 [0.00, .300, .325, .218, 2.15,2.2],
 [-0.30,.243, .288, .185, 2.1, 2.15],
 [-0.55,.180, .203, .128, 2.05,2.1],
 [-0.75,.124, .125, .078, 2.0, 2.05],
 [-0.90,.088, .076, .050, 2.0, 2.05],
 [-1.00,.068, .055, .038, 2.0, 2.0],
 [-1.075,.046,.037, .027, 2.0, 2.0],
 [-1.125,.020,.016, .012, 2.0, 2.0],
 [-1.14, .000,.000, .000, 2.0, 2.0]];
const LIP=4;            // station index of the inner lip edge
const OUT0=7;           // from here on x falls monotonically (outer body)
function cr(a,b,c,d,u){ const u2=u*u,u3=u2*u; return .5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u2+(-a+3*b-3*c+d)*u3); }
function station(s){ // s is a fractional station index
  const n=STN.length; const i=Math.max(0,Math.min(n-2,Math.floor(s))); const u=s-i;
  const a=STN[Math.max(0,i-1)], b=STN[i], c=STN[i+1], d=STN[Math.min(n-1,i+2)];
  const o=[]; for(let k=0;k<6;k++) o.push(cr(a[k],b[k],c[k],d[k],u));
  o[1]=Math.max(0,o[1]); o[2]=Math.max(0,o[2]); o[3]=Math.max(0,o[3]); return o;
}
function atX(x){ // outer section at a given x (linear between outer stations)
  for(let i=OUT0;i<STN.length-1;i++){ const a=STN[i], b=STN[i+1];
    if(x<=a[0] && x>=b[0]){ const u=(a[0]-x)/(a[0]-b[0]); return station(i+u); } }
  return x>STN[OUT0][0]? station(OUT0) : station(STN.length-1);
}
function secPt(S, th){ // superellipse section point (y,z) for parameter angle th (0 = right side, pi/2 = top)
  const c=Math.cos(th), s=Math.sin(th); const n=s>0? S[4]:S[5];
  const r=Math.pow(Math.pow(Math.abs(c),n)+Math.pow(Math.abs(s),n),1/n);
  return [ (s>0? S[2]:S[3])*s/r, S[1]*c/r ];
}
const sm=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
// the three flank ridges: [phi, x start, x end, height]; phi = angle above the side line
const RIDGES=[[1.02, .92,-.62,.008],[.60, .88,-.86,.007],[.17, .80,-1.08,.007]];
function ridgeH(x,phi){ let h=0;
  for(const R of RIDGES){ const env=sm(R[1],R[1]-.25,x)*sm(R[2],R[2]+.2,x);
    let hk=R[3]; if(R===RIDGES[2]) hk+= .016*sm(-.7,-.98,x)*sm(-1.12,-1.03,x);   // the lowest ridge becomes the tail keel
    const w=R===RIDGES[2]? .07+.08*sm(-.6,-.98,x) : .065;
    h+=env*hk*Math.exp(-Math.pow((phi-R[0])/w,2)); }
  return h; }

const V=[]; const I=[];      // vertex floats (14 each) and indices
function pushGrid(P, NA, NB, attrM, attrX, orient){
  // P: (NA+1)*(NB+1) points [x,y,z]; columns wrap (column NB == column 0)
  const nrm=new Array(P.length);
  const at=(i,j)=>P[i*(NB+1)+j];
  for(let i=0;i<=NA;i++) for(let j=0;j<=NB;j++){
    const a=at(Math.min(NA,i+1),j), b=at(Math.max(0,i-1),j);
    const jp=j===NB? 1 : j+1, jm=j===0? NB-1 : j-1;
    const c=at(i,jp), d=at(i,jm);
    const dA=[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dB=[c[0]-d[0],c[1]-d[1],c[2]-d[2]];
    let n=[dA[1]*dB[2]-dA[2]*dB[1], dA[2]*dB[0]-dA[0]*dB[2], dA[0]*dB[1]-dA[1]*dB[0]];
    const l=Math.hypot(n[0],n[1],n[2]); nrm[i*(NB+1)+j]= l>1e-12? [n[0]/l,n[1]/l,n[2]/l] : null;
  }
  // degenerate rows (poles): copy from the nearest valid row
  for(let pass=0;pass<2;pass++) for(let i=0;i<=NA;i++) for(let j=0;j<=NB;j++){ const k=i*(NB+1)+j; if(nrm[k]) continue;
    const up=i>0? nrm[(i-1)*(NB+1)+j]:null, dn=i<NA? nrm[(i+1)*(NB+1)+j]:null; nrm[k]=(pass===0? (dn||up) : (up||dn)); }
  for(let k=0;k<nrm.length;k++) if(!nrm[k]) nrm[k]=[0,1,0];
  const flip=orient(nrm,P)? 1 : -1;
  const base=V.length/14;
  for(let i=0;i<=NA;i++) for(let j=0;j<=NB;j++){ const k=i*(NB+1)+j, p=P[k], n=nrm[k];
    const m=attrM(i,j,p,[n[0]*flip,n[1]*flip,n[2]*flip]), x=attrX(i,j,p);
    V.push(p[0],p[1],p[2], n[0]*flip,n[1]*flip,n[2]*flip, m[0],m[1],m[2],m[3], x[0],x[1],x[2],x[3]); }
  for(let i=0;i<NA;i++) for(let j=0;j<NB;j++){ const a=base+i*(NB+1)+j, b=a+NB+1;
    I.push(a,b,b+1, a,b+1,a+1); }
}

/* ---- body ---- */
const NU=250, NV=152, NC=30;    // rings, points round each ring, pattern rows round the body
{
  // place rings evenly along the surface (arc length over the station parameter), denser round the lips
  const fine=[]; let acc=0; const M=2400, sEnd=STN.length-1;
  let prev=station(0), pr=[0,0];
  fine.push([0,0]);
  for(let k=1;k<=M;k++){ const s=sEnd*k/M, S=station(s);
    const d=Math.hypot(S[0]-prev[0], S[1]-prev[1], .9*(S[2]-prev[2]), .9*(S[3]-prev[3]));
    const w= s<LIP+3? 1.9 : s<10? 1.35 : 1.;
    acc+=d*w+.0004; fine.push([s,acc]); prev=S; }
  const ringS=[]; let f=0;
  for(let i=0;i<=NU;i++){ const target=acc*i/NU; while(f<fine.length-2 && fine[f+1][1]<target) f++;
    const a=fine[f], b=fine[f+1]; ringS.push(a[0]+(b[0]-a[0])*(target-a[1])/Math.max(1e-9,b[1]-a[1])); }
  // pattern coordinate along the body: cells stay square as the body tapers
  const puX=[]; { let p=0; for(let x=1.47;x>=-1.2;x-=.005){ const S=atX(x); const per=Math.PI*(S[1]+(S[2]+S[3])*.5)*1.08+.02; puX.push(p); p+=.005*NC/per; } }
  const puAt=x=>{ const g=(1.47-x)/.005; const i=Math.max(0,Math.min(puX.length-2,Math.floor(g))); const u=Math.min(1,Math.max(0,g-i)); return puX[i]+(puX[i+1]-puX[i])*u; };
  const P=[]; const ringInfo=[]; let puAcc=0, prevS=null;
  for(let i=0;i<=NU;i++){
    const s=ringS[i], S=station(s);
    // the ring before ridges: section points, then push the ridges out along the section normal
    const ring=[];
    for(let j=0;j<=NV;j++){ const th=-Math.PI/2+2*Math.PI*j/NV; ring.push(secPt(S,th)); }
    for(let j=0;j<=NV;j++){
      const th=-Math.PI/2+2*Math.PI*j/NV;
      const a=ring[j===NV?1:j+1], b=ring[j===0?NV-1:j-1];
      let ny=-(a[1]-b[1]), nz=(a[0]-b[0]); const l=Math.hypot(ny,nz)||1; ny/=l; nz/=l;
      if(ny*ring[j][0]+nz*ring[j][1]<0){ ny=-ny; nz=-nz; }
      const phi=Math.atan2(Math.sin(th),Math.abs(Math.cos(th)));
      const h= s>LIP+2? ridgeH(S[0],phi) : 0;
      let y=ring[j][0]+ny*h, z=ring[j][1]+nz*h;
      let x=S[0]+.24*y*sm(1.12,1.40,S[0])*(s>LIP-1?1:sm(LIP-3,LIP-1,s));   // the upper jaw overhangs the lower one
      P.push([x,y,z]);
    }
    if(prevS){ const m=(S[1]+S[2]+S[3])/3, pm=(prevS[1]+prevS[2]+prevS[3])/3;
      const per=Math.PI*(S[1]+(S[2]+S[3])*.5)*1.08+.02; puAcc+=Math.hypot(S[0]-prevS[0], m-pm)*NC/per; }
    prevS=S; ringInfo.push([s,S[0],puAcc]);
  }
  pushGrid(P,NU,NV,
    (i,j,p,n)=>{ const s=ringInfo[i][0]; const part= s<LIP+.55? 1 : 0;
      return [part, ringInfo[i][2], j/NV, 0]; },
    (i,j,p)=>{ const s=ringInfo[i][0]; const th=-Math.PI/2+2*Math.PI*j/NV;
      return [0, Math.atan2(Math.sin(th),Math.abs(Math.cos(th))), Math.max(0,Math.min(1,(LIP-s)/LIP)), s]; },
    (nrm,P)=>{ // a top vertex in mid body must face up
      const i=Math.round(NU*.6), j=Math.round(NV*.5); return nrm[i*(NV+1)+j][1]>0; });
}

/* ---- fins ---- */
function af(q){ q=Math.max(0,Math.min(1,q)); return (.2969*Math.sqrt(q)-.126*q-.3516*q*q+.2843*q*q*q-.1036*q*q*q*q)/.1; }
function norm(v){ const l=Math.hypot(v[0],v[1],v[2]); return [v[0]/l,v[1]/l,v[2]/l]; }
function crs(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function fin(o){
  // o: O root leading point, c chord dir, s span dir, S span length, a0 start (negative = buried in the body),
  //    le(a), ch(a), th(a), dr(a) droop along the fin normal, part, flap, NA, NB, mirror, cell
  const s=norm(o.s); let c=o.c; const k=c[0]*s[0]+c[1]*s[1]+c[2]*s[2]; c=norm([c[0]-s[0]*k,c[1]-s[1]*k,c[2]-s[2]*k]);
  let n=norm(crs(c,s)); if(o.up && (n[0]*o.up[0]+n[1]*o.up[1]+n[2]*o.up[2])<0) n=[-n[0],-n[1],-n[2]];
  const P=[], info=[];
  for(let i=0;i<=o.NA;i++){ const g=i/o.NA; const a=o.a0+(1-o.a0)*(1-Math.pow(1-g,1.25));
    const le=o.le(a), ch=o.ch(a), th=o.th(a), dr=o.dr? o.dr(a):0;
    for(let j=0;j<=o.NB;j++){ const b=2*Math.PI*j/o.NB; const q=(1-Math.cos(b))/2, side= j<=o.NB/2? 1:-1;
      const off=dr+side*th*af(q);
      const p=[o.O[0]+c[0]*(le+q*ch)+s[0]*a*o.S+n[0]*off, o.O[1]+c[1]*(le+q*ch)+s[1]*a*o.S+n[1]*off, o.O[2]+c[2]*(le+q*ch)+s[2]*a*o.S+n[2]*off];
      if(o.mirror) p[2]=-p[2];
      P.push(p); info.push([le+q*ch, a*o.S, side]); }
  }
  const nm=o.mirror? [n[0],n[1],-n[2]] : n;
  pushGrid(P,o.NA,o.NB,
    (i,j,p,nn)=>{ const f=info[i*(o.NB+1)+j]; const dors=o.dark? 1 : Math.min(1,Math.max(0,(nn[1]+.25)*2.2));
      return [o.part, f[0]/o.cell, f[1]/o.cell+(o.mirror?17.3:0)+o.seed, dors]; },
    (i,j,p)=>{ const f=info[i*(o.NB+1)+j]; return [o.flap? Math.max(0,f[1]) : 0, 0, 0, 0]; },
    (nrm,P)=>{ const kk=Math.round(o.NA*.5)*(o.NB+1)+Math.round(o.NB*.25); const v=nrm[kk]; return v[0]*nm[0]+v[1]*nm[1]+v[2]*nm[2]>0; });
}
function sideAt(x,phi,inset){ // point on the right flank at x and angle phi, pushed in by inset
  const S=atX(x); const p=secPt(S,phi); const l=Math.hypot(p[0],p[1])||1; return [x, p[0]-p[0]/l*inset, p[1]-p[1]/l*inset]; }
// pectoral fins: large, low on the flank just behind the gills, swept back and down
for(const mir of [false,true]){
  const O=sideAt(.80,-.30,.05);
  fin({O, c:[-1,0,.0], s:[-.30,-.36,1], S:.60, a0:-.10, up:[0,1,0],
    le:a=>.36*Math.pow(Math.max(a,0),1.35), ch:a=>{ const A=Math.max(a,0); return .34*Math.pow(1-Math.pow(A,1.7),.55)*(1-.30*A)+.006; },
    th:a=>.030*Math.pow(1-Math.max(a,0),.7)+.0015, dr:a=>-.07*Math.max(a,0)*Math.max(a,0),
    part:5, flap:true, NA:44, NB:44, mirror:mir, cell:.05, seed:3});
}
// first dorsal fin
fin({O:[.02,.25,0], c:[-1,0,0], s:[-.55,1,0], S:.44, a0:-.08, up:[0,0,1],
  le:a=>.05*Math.max(a,0)*Math.max(a,0), ch:a=>{ const A=Math.max(a,0); return .44*Math.pow(1-A,.85)*(1-.15*A)+.006; },
  th:a=>.034*Math.pow(1-Math.max(a,0),.6)+.0015, part:2, dark:true, NA:40, NB:40, cell:.05, seed:7});
// second dorsal fin
fin({O:[-.655,.085,0], c:[-1,0,0], s:[-.6,1,0], S:.19, a0:-.05, up:[0,0,1],
  le:a=>0, ch:a=>.15*Math.pow(1-Math.max(a,0),.8)+.004, th:a=>.016*Math.pow(1-Math.max(a,0),.6)+.001,
  part:2, dark:true, NA:20, NB:28, cell:.05, seed:11});
// pelvic fins
for(const mir of [false,true]){
  const O=sideAt(-.33,-1.15,.04);
  fin({O, c:[-1,0,0], s:[-.35,-.75,.55], S:.17, a0:-.08, up:[0,1,0],
    le:a=>.03*Math.max(a,0), ch:a=>.15*Math.pow(1-Math.max(a,0),.75)+.004, th:a=>.014*Math.pow(1-Math.max(a,0),.6)+.001,
    part:2, NA:18, NB:28, mirror:mir, cell:.05, seed:13});
}
// anal fin
fin({O:[-.69,-.045,0], c:[-1,0,0], s:[-.6,-1,0], S:.13, a0:-.05, up:[0,0,1],
  le:a=>0, ch:a=>.12*Math.pow(1-Math.max(a,0),.8)+.004, th:a=>.013*Math.pow(1-Math.max(a,0),.6)+.001,
  part:2, NA:16, NB:28, cell:.05, seed:19});
// tail: tall, the upper lobe much larger; lofted from the lower tip to the upper tip
{
  const NA=76, NB=44, YU=.50, YL=-.29; const P=[], info=[];
  for(let i=0;i<=NA;i++){ const g=i/NA; const y=YL+(YU-YL)*(.5-.5*Math.cos(Math.PI*g));
    let le, te;
    if(y>=0){ const u=y/YU; le=-.88-.533*Math.pow(u,1.12)+.035*Math.sin(Math.PI*u); te=-1.13-.308*Math.pow(u,.62)+.04*Math.sin(Math.PI*u)*0; }
    else { const u=y/YL; le=-.90-.32*Math.pow(u,1.05)+.02*Math.sin(Math.PI*u); te=-1.13-.09*Math.pow(u,.7); }
    const tip=Math.min(Math.abs(y-YU),Math.abs(y-YL));
    const ch=Math.max(te<le? le-te : 0, .004);
    const th=.008+.030*sm(.30,0,Math.abs(y))*(y>0? 1 : 1)+.004*sm(0,.05,tip);
    for(let j=0;j<=NB;j++){ const b=2*Math.PI*j/NB; const q=(1-Math.cos(b))/2, side=j<=NB/2?1:-1;
      const p=[le-q*ch, y, side*th*af(q)*sm(0,.06,tip+.004)];
      P.push(p); info.push([q*ch, y]); }
  }
  pushGrid(P,NA,NB,
    (i,j,p,nn)=>{ const f=info[i*(NB+1)+j]; return [4, -p[0]/.05, p[1]/.05+40, 1]; },
    (i,j,p)=>[0,0,0,0],
    (nrm,P)=>{ const kk=Math.round(NA*.7)*(NB+1)+Math.round(NB*.25); return nrm[kk][2]>0; });
}
// eyes: small, at the sides of the head just behind the mouth corners
for(const sgn of [1,-1]){
  const NA=16, NB=24, R=.024, C=[1.33,.045,.350*sgn]; const P=[];
  for(let i=0;i<=NA;i++){ const v=Math.PI*i/NA; for(let j=0;j<=NB;j++){ const u=2*Math.PI*j/NB;
    P.push([C[0]+R*Math.sin(v)*Math.cos(u), C[1]+R*Math.cos(v)*.85, C[2]+R*Math.sin(v)*Math.sin(u)]); } }
  pushGrid(P,NA,NB, (i,j,p,n)=>{ const d=[(p[0]-C[0]),(p[1]-C[1]),(p[2]-C[2])];
      return [3, d[0]/R, d[1]/R, d[2]*sgn/R]; }, ()=>[0,0,0,0],
    (nrm,P)=>{ const k=Math.round(NA/2)*(NB+1)+3; const p=P[k]; return nrm[k][0]*(p[0]-C[0])+nrm[k][1]*(p[1]-C[1])+nrm[k][2]*(p[2]-C[2])>0; });
}
// make the nose tip exactly 1.45 ahead of the centre
let maxX=-9, minX=9; for(let k=0;k<V.length;k+=14){ maxX=Math.max(maxX,V[k]); minX=Math.min(minX,V[k]); }
const shiftX=1.45-maxX; for(let k=0;k<V.length;k+=14) V[k]+=shiftX;
const STATS={verts:V.length/14, tris:I.length/3, nose:maxX+shiftX, tail:minX+shiftX};

/* ---------- places to leave free ---------- */
const KELP=[[-1.22,-.35],[-1.08,-.5],[-1.28,-.72],[1.2,-.45],[1.3,-.3],[-.6,-2.3],[-.48,-2.45],[.98,-2.9],[1.1,-3.05],[.86,-3.1],
  [-1.0,-4.9],[-.8,-5.0],[.9,-5.1],[.55,-5.2],[-.2,-5.15],[1.22,-4.6],[-.05,-3.9]].map(k=>[k[0]*XS,k[1]]);
const BUBC=[[-.25,-3.5],[.8,-2.0],[-.9,-1.3],[-1.25,.45],[1.05,.8],[.25,.3]].map(k=>[k[0]*XS,k[1]]);
const XMAX=TW-.1, ZMIN=-5.3, ZMAX=-.25;
const used=[];   // discs taken by pieces: [x,z,r]
function freeAt(x,z,r,opt){ opt=opt||{};
  if(Math.abs(x)>XMAX-r*.5 || z<ZMIN+r*.3 || z>ZMAX-r*.3) return false;
  for(const k of KELP) if(Math.hypot(x-k[0],z-k[1])<r+(opt.kelp??.10)) return false;
  for(const b of BUBC) if(Math.hypot(x-b[0],z-b[1])<r+.12) return false;
  if(!opt.ignoreUsed) for(const u of used) if(Math.hypot(x-u[0],z-u[1])<r+u[2]*(opt.overlap??1)) return false;
  if(opt.sandOnly && rockTop(x,z)>-TH-.01) return false;
  return true; }
// height cap: the mid-water stays clear; tall pieces only near the side walls or the back
const capY=(x,z,g)=>(Math.abs(x)>TW-.45 || z<-5.0)? .12 : Math.max(-.30, g+.07);

/* ---------- mesh builder ---------- */
const P=[],N=[],C=[],Q=[],U=[],I=[]; let nv=0;
function vtx(p,n,c,q,uv){ P.push(p[0],p[1],p[2]); N.push(n[0],n[1],n[2]); C.push(c[0],c[1],c[2],c[3]||0);
  Q.push(q[0],q[1],q[2],q[3]); U.push(uv?uv[0]:0, uv?uv[1]:0); return nv++; }
const tri=(a,b,c)=>I.push(a,b,c);
let pieceV0=0, pieceI0=0;
function begin(){ pieceV0=nv; pieceI0=I.length; }
// scale the piece about its base so it obeys the height cap
function fit(base){ let s=1;
  for(let i=pieceV0;i<nv;i++){ const x=P[i*3], y=P[i*3+1], z=P[i*3+2]; const cap=capY(x,z,base[1]);
    if(y>cap && y>base[1]+1e-4) s=Math.min(s,(cap-base[1])/(y-base[1])); }
  s=Math.max(s,.35);
  if(s<1) for(let i=pieceV0;i<nv;i++){ for(let k=0;k<3;k++) P[i*3+k]=base[k]+(P[i*3+k]-base[k])*s; Q[i*4+1]*=s; }
  return s; }
// tint by height inside a piece: a soft ambient occlusion toward its base
function aoPiece(y0,y1,lo){ for(let i=pieceV0;i<nv;i++){ const t=sstep(y0,y1,P[i*3+1]); const k=lo+(1-lo)*t; C[i*4]*=k; C[i*4+1]*=k; C[i*4+2]*=k; } }

// grid surface: f(u,v) -> {p, c, q, uv}; out(p) gives a rough outward direction to orient normals
function grid(nu,nvv,wrap,f,out){
  const cols=wrap?nu:nu+1, pts=[];
  for(let j=0;j<=nvv;j++) for(let i=0;i<cols;i++) pts.push(f(i/nu,j/nvv));
  const at=(i,j)=>{ if(wrap) i=(i+cols)%cols; else i=Math.max(0,Math.min(cols-1,i)); j=Math.max(0,Math.min(nvv,j)); return pts[j*cols+i].p; };
  const b=nv;
  for(let j=0;j<=nvv;j++) for(let i=0;i<cols;i++){ const s=pts[j*cols+i];
    let n=cross(sub(at(i+1,j),at(i-1,j)), sub(at(i,j+1),at(i,j-1)));
    const o=out(s.p); if(len(n)<1e-9) n=o; else if(dot(n,o)<0) n=mul(n,-1);
    if(s.n) n=s.n;
    vtx(s.p,nrm(n),s.c,s.q,s.uv); }
  const qn=wrap?nu:nu;
  for(let j=0;j<nvv;j++) for(let i=0;i<qn;i++){ const i1=wrap?(i+1)%cols:i+1;
    const a=b+j*cols+i, bb=b+j*cols+i1, c=b+(j+1)*cols+i1, d=b+(j+1)*cols+i; tri(a,bb,c); tri(a,c,d); }
}
// tube along a polyline; pts: {p, r, c(rgba), sw (sway amplitude), e (night glow)}
function tube(pts,mat,ph,sides,cap){
  const n=pts.length; if(n<2) return;
  const T=[]; for(let i=0;i<n;i++) T.push(nrm(sub(pts[Math.min(n-1,i+1)].p, pts[Math.max(0,i-1)].p)));
  let nf=perp(T[0]); const b0=nv;
  for(let i=0;i<n;i++){
    nf=nrm(sub(nf,mul(T[i],dot(nf,T[i])))); const bf=cross(T[i],nf); const s=pts[i];
    for(let k=0;k<sides;k++){ const a=k/sides*TAU; const d=add(mul(nf,Math.cos(a)),mul(bf,Math.sin(a)));
      vtx(add(s.p,mul(d,s.r)), d, s.c, [mat,s.sw||0,ph,s.e||0]); } }
  for(let i=0;i<n-1;i++) for(let k=0;k<sides;k++){ const k1=(k+1)%sides;
    const a=b0+i*sides+k, b=b0+i*sides+k1, c=b0+(i+1)*sides+k1, d=b0+(i+1)*sides+k; tri(a,b,c); tri(a,c,d); }
  if(cap){ const s=pts[n-1], t=T[n-1]; nf=nrm(sub(nf,mul(t,dot(nf,t)))); const bf=cross(t,nf);
    const mid=add(s.p,mul(t,s.r*.55)); const rb=nv;
    for(let k=0;k<sides;k++){ const a=k/sides*TAU; const d=add(mul(nf,Math.cos(a)),mul(bf,Math.sin(a)));
      vtx(add(mid,mul(d,s.r*.72)), nrm(add(d,mul(t,.8))), s.c, [mat,s.sw||0,ph,s.e||0]); }
    const tip=vtx(add(s.p,mul(t,s.r*.95)), t, s.c, [mat,s.sw||0,ph,s.e||0]);
    const last=b0+(n-1)*sides;
    for(let k=0;k<sides;k++){ const k1=(k+1)%sides; tri(last+k,last+k1,rb+k1); tri(last+k,rb+k1,rb+k); tri(rb+k,rb+k1,tip); } }
}
function sphere(c,rad,sq,col,q,nu,nvv,lump,seed){
  grid(nu||8,nvv||6,true,(u,v)=>{ const th=u*TAU, ph=v*PI; const d=[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];
    const k=1+(lump||0)*(n3(d[0]*2.1+seed,d[1]*2.1+seed*.7,d[2]*2.1+3)-.5);
    return {p:add(c,[d[0]*rad*k,d[1]*rad*k*sq,d[2]*rad*k]), c:col, q}; }, p=>sub(p,c));
}

/* ---------- palette (bright, so it survives the water) ---------- */
const PAL={
  pink:[1.0,.40,.55], salmon:[1.0,.50,.40], orange:[1.0,.42,.08], peach:[1.0,.72,.50], yellow:[1.0,.84,.22], lemon:[.95,.95,.45],
  lav:[.72,.58,1.0], purple:[.55,.28,.92], magenta:[.95,.22,.72], red:[.92,.18,.22], teal:[.18,.86,.78], cyan:[.35,.95,1.0],
  lime:[.62,.95,.28], mint:[.55,.95,.70], cream:[1.0,.93,.78], blue:[.25,.45,1.0], olive:[.62,.66,.30], sand:[.86,.78,.62] };
const tint=(c,k)=>[Math.min(1,c[0]*k),Math.min(1,c[1]*k),Math.min(1,c[2]*k)];
const mixc=(a,b,t)=>lerp3(a,b,t);
const jit=(c,a)=>[Math.min(1,Math.max(0,c[0]*(1+(R()-.5)*a))),Math.min(1,Math.max(0,c[1]*(1+(R()-.5)*a))),Math.min(1,Math.max(0,c[2]*(1+(R()-.5)*a)))];

/* ---------- branching hard coral (staghorn / tree), a stochastic L-system ---------- */
function staghorn(x,z,o){
  const g=seat(x,z,.03); const base=[x,g.m-.012,z]; begin();
  const segs=[]; const lift=o.up??.16;
  function br(p,d,L,r,depth,ord){
    const steps=Math.max(2,Math.round(L/.032)); const pts=[]; let q=p, dd=d;
    for(let i=0;i<=steps;i++){ pts.push({p:q,r:r*(1-.22*i/steps)});
      if(i<steps){ dd=nrm(add(dd,[(R()-.5)*o.wig,lift,(R()-.5)*o.wig])); const gy=groundAt(q[0],q[2]); if(q[1]<gy+.02 && dd[1]<.2) dd=nrm([dd[0],.35,dd[2]]); q=add(q,mul(dd,L/steps)); } }
    segs.push({pts,depth,ord});
    const re=r*(1-.22);
    if(depth>0){
      const nc=R()<o.three?3:2; const az0=R()*TAU;
      for(let c=0;c<nc;c++){ const ax=rot(perp(dd),dd,az0+c*TAU/nc); const ang=c===0? rr(.12,.35) : rr(o.ang[0],o.ang[1]);
        br(q,nrm(rot(dd,ax,ang)),L*rr(.72,.92),re*(c===0?.92:.78),depth-1,ord+1); }
      if(depth>1 && R()<o.side){ const mid=pts[Math.floor(pts.length*.5)]; const ax=perp(dd);
        br(mid.p,nrm(rot(dd,rot(ax,dd,R()*TAU),rr(.6,1.0))),L*.6,mid.r*.7,depth-2,ord+1); }
    }
  }
  for(let k=0;k<o.trunks;k++){ const az=k/o.trunks*TAU+R()*.8; const tilt=rr(o.tilt[0],o.tilt[1]);
    const d=nrm([Math.sin(tilt)*Math.cos(az),Math.cos(tilt),Math.sin(tilt)*Math.sin(az)]);
    const p0=add(base,[Math.cos(az)*o.spread*R(),0,Math.sin(az)*o.spread*R()]); p0[1]=groundAt(p0[0],p0[2])-.012;
    br(p0,d,o.L*rr(.85,1.15),o.r*rr(.85,1.1),o.depth,0); }
  let ytop=base[1]; for(const s of segs) for(const p of s.pts) ytop=Math.max(ytop,p.p[1]);
  const H=Math.max(.05,ytop-base[1]); const ph=R()*TAU;
  for(const s of segs){ const term=s.depth===0;
    const pts=s.pts.map((p,i)=>{ const hy=(p.p[1]-base[1])/H; const tipk=term? sstep(.45,1,i/(s.pts.length-1)) : 0;
      let c=mixc(o.c0,o.c1,sstep(.1,1,hy)); c=mixc(c,o.tip,tipk*.85);
      return {p:p.p,r:p.r,c:[...c,tipk],sw:o.sway? o.sway*Math.pow(Math.max(hy,0),1.7):0,e:tipk*(o.glow||0)}; });
    tube(pts,o.mat??1,ph,o.sides||5,true); }
  aoPiece(base[1],base[1]+H*.8,.62);
  fit(base);
  used.push([x,z,o.foot||.12]);
}

/* ---------- brain / boulder coral ---------- */
function dome(x,z,o){
  const Rr=o.R, H=o.H; const g=seat(x,z,Rr*.9); const by=Math.min(g.c-.004, g.m+.10*H); const c0=[x,by,z];
  begin(); const sd=R()*20;
  grid(o.nu||(Rr>.12?44:30),o.nv||(Rr>.12?12:9),true,(u,v)=>{ const th=u*TAU, ph=v*1.86; const d=[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];
    const k=1+o.lump*(n3(d[0]*1.6+sd,d[1]*1.6+sd*.3,d[2]*1.6+5)-.5)+.08*(n3(d[0]*4+sd,d[1]*4,d[2]*4+sd)-.5);
    const p=add(c0,[d[0]*Rr*k,d[1]*H*k,d[2]*Rr*k]);
    const col=mixc(o.c1,o.c0,sstep(.0,1.,v*1.2));
    return {p,c:[...col,0],q:[o.mat,0,0,0]}; }, p=>sub(p,[c0[0],c0[1]-H*.3,c0[2]]));
  aoPiece(by-.2*H,by+H*.6,.55);
  fit(c0);
  used.push([x,z,Rr*.9]);
}

/* ---------- table coral ---------- */
function table(x,z,o){
  const g=seat(x,z,.03); const base=[x,g.m-.01,z]; begin();
  const top=Math.min(base[1]+o.h, capY(x,z,base[1])-.03); const ctr=[x+o.dx,top,z+o.dz];
  // trunk
  const tp=[]; for(let i=0;i<=6;i++){ const t=i/6; tp.push({p:lerp3(base,[ctr[0],ctr[1]-.01,ctr[2]],t),r:mix(o.tr,o.tr*.7,t),c:[...tint(o.c0,.7),0]}); }
  tube(tp,1,0,8,false);
  const sd=R()*30, Rr=o.R, th=o.th;
  const edge=a=>Rr*(1+.16*(n3(Math.cos(a)*1.3+sd,Math.sin(a)*1.3,2)-.5)*2+.05*Math.sin(a*7+sd));
  const pAt=(a,rho,dy)=>{ const e=edge(a)*rho; const y=ctr[1]+o.dish*rho*rho+dy*(1-.5*rho)+.012*(n3(Math.cos(a)*3+sd,Math.sin(a)*3,rho*3)-.5);
    return [ctr[0]+Math.cos(a)*e, y, ctr[2]+Math.sin(a)*e]; };
  const colAt=rho=>[...mixc(o.c0,o.c1,sstep(.55,1,rho)),rho];
  grid(56,9,true,(u,v)=>({p:pAt(u*TAU,Math.max(v,.03),0),c:colAt(v),q:[5,0,0,0],uv:[u,v]}),()=>[0,1,0]);
  grid(56,6,true,(u,v)=>({p:pAt(u*TAU,Math.max(v,.03),-th),c:[...tint(o.c0,.55),v],q:[1,0,0,0]}),()=>[0,-1,0]);
  grid(56,1,true,(u,v)=>{ const a=u*TAU; const p=pAt(a,1,-th*(1-v)); return {p,c:colAt(1),q:[1,0,0,0]}; },p=>[p[0]-ctr[0],0,p[2]-ctr[2]]);
  aoPiece(base[1],top,.5);
  used.push([x,z,o.foot||Rr*.5]);
}

/* ---------- tube sponges ---------- */
function sponges(x,z,o){
  const g=seat(x,z,.06); begin(); const base=[x,g.m,z];
  for(let k=0;k<o.n;k++){
    const a=k/o.n*TAU+R(), off=o.n>1? rr(.015,o.spread):0; const bx=x+Math.cos(a)*off, bz=z+Math.sin(a)*off; const by=groundAt(bx,bz)-.02;
    const h=o.h*rr(.6,1.1), r0=o.r*rr(.75,1.15); const lean=[Math.cos(a)*rr(.1,.35)*h,0,Math.sin(a)*rr(.1,.35)*h];
    const col=jit(o.c,.15), ph=R()*TAU, sd=R()*40;
    const ctr=v=>add([bx,by,bz],[lean[0]*v*v,h*v,lean[2]*v*v]);
    const rad=v=>r0*(.8+.45*v+.2*sstep(.85,1,v))*(1+.06*Math.sin(v*9+sd));
    const sw=v=>(o.sway||0)*v*v;
    grid(12,10,true,(u,v)=>{ const th=u*TAU, c=ctr(v), r=rad(v)*(1+.05*(n3(Math.cos(th)*2+sd,v*4,Math.sin(th)*2)-.5));
      return {p:add(c,[Math.cos(th)*r,0,Math.sin(th)*r]),c:[...mixc(tint(col,.7),col,sstep(0,.6,v)),0],q:[3,sw(v),ph,0]}; },p=>{ const c=ctr(sat01((p[1]-by)/h)); return [p[0]-c[0],0,p[2]-c[2]]; });
    // lip and inner wall, darker inside
    grid(12,2,true,(u,v)=>{ const th=u*TAU, c=ctr(1), r=rad(1)*(1-.22*v); return {p:add(c,[Math.cos(th)*r,.004*Math.sin(v*PI),Math.sin(th)*r]),c:[...tint(col,1.1),0],q:[3,sw(1),ph,0]}; },()=>[0,1,0]);
    grid(12,5,true,(u,v)=>{ const th=u*TAU, vv=1-v*.75, c=ctr(vv), r=Math.min(rad(1)*.80,rad(vv)*.72); return {p:add(c,[Math.cos(th)*r,0,Math.sin(th)*r]),c:[...tint(col,.35*(1-v)+.08),0],q:[3,sw(vv),ph,0]}; },p=>{ const c=ctr(1); return [c[0]-p[0],0,c[2]-p[2]]; });
    grid(12,1,true,(u,v)=>{ const th=u*TAU, c=ctr(.25), r=rad(.25)*.72*(1-v); return {p:add(c,[Math.cos(th)*r,0,Math.sin(th)*r]),c:[...tint(col,.06),0],q:[0,sw(.25),ph,0]}; },()=>[0,1,0]);
  }
  aoPiece(base[1],base[1]+o.h*.7,.55);
  fit(base);
  used.push([x,z,o.foot||o.spread+o.r]);
}
const sat01=x=>Math.min(1,Math.max(0,x));
const mix=(a,b,t)=>a+(b-a)*t;

/* ---------- sea fan (gorgonian): a swaying lattice, cut in the shader ---------- */
function seaFan(x,z,o){
  const g=seat(x,z,.02); const base=[x,g.m-.01,z]; begin();
  const yaw=o.yaw, nrmv=[Math.sin(yaw),0,Math.cos(yaw)], rt=[Math.cos(yaw),0,-Math.sin(yaw)], up=[0,1,0];
  const Rr=o.R, sd=R()*50, ph=R()*TAU, stalk=.03;
  const rim=a=>Rr*(1+.12*Math.sin(a*3.1+sd)+.06*Math.sin(a*7.3+sd*2));
  const amax=o.spread||.95;
  const pos=(a,rho)=>{ const e=rim(a)*rho; const lx=Math.sin(a)*e, ly=Math.cos(a)*e*1.12;
    return {p:add(add(add(base,mul(up,stalk+ly)),mul(rt,lx)),mul(nrmv,.025*(lx*lx)/Rr+.012*Math.sin(ly*7+sd)+.01*Math.sin(lx*6+sd))), uv:[lx,ly]}; };
  const col=o.c;
  grid(34,22,false,(u,v)=>{ const a=(u*2-1)*amax, rho=.06+.94*v; const q=pos(a,rho);
    const c=mixc(tint(col,.75),col,sstep(.1,.9,rho));
    return {p:q.p,c:[...c,rho],q:[4,o.sway*Math.pow(rho,1.5),ph,0],uv:q.uv}; },()=>nrmv);
  // stalk into the ground, then main branches fanning out in the plane
  const th0=.004+.008*Rr; const sp=[]; for(let i=0;i<=3;i++){ const t=i/3; sp.push({p:add(base,[0,(stalk+.04*Rr)*t-.01*(1-t),0]),r:th0*(1.4-.4*t),c:[...tint(col,.55),0],sw:0}); }
  tube(sp,1,ph,6,false);
  const nb=5+Math.floor(R()*3);
  for(let b=0;b<nb;b++){ const ai=((b+.5)/nb*2-1)*amax*.85+(R()-.5)*.12; const r1=rr(.75,.95); const pts=[];
    for(let i=0;i<=10;i++){ const rho=.04+(r1-.04)*i/10; const a=ai*sstep(.04,.45,rho); const q=pos(a,rho);
      pts.push({p:q.p,r:th0*(1-.75*rho/r1)+.0012,c:[...mixc(tint(col,.6),tint(col,1.05),rho),rho],sw:o.sway*Math.pow(rho,1.5)}); }
    tube(pts,1,ph,5,false); }
  fit(base);
  used.push([x,z,o.foot||.08]);
}

/* ---------- soft coral tree (Dendronephthya): translucent stalks, bunches of polyp balls ---------- */
function softTree(x,z,o){
  const g=seat(x,z,.03); const base=[x,g.m-.01,z]; begin(); const ph=R()*TAU;
  const ends=[]; const segs=[];
  function br(p,d,L,r,depth){ const steps=Math.max(2,Math.round(L/.02)); const pts=[]; let q=p, dd=d;
    for(let i=0;i<=steps;i++){ pts.push({p:q,r:r*(1-.3*i/steps)}); if(i<steps){ dd=nrm(add(dd,[(R()-.5)*.3,.15,(R()-.5)*.3])); q=add(q,mul(dd,L/steps)); } }
    segs.push(pts);
    if(depth>0){ const nc=R()<.25?3:2; const az=R()*TAU; for(let c=0;c<nc;c++){ const ax=rot(perp(dd),dd,az+c*TAU/nc); br(q,nrm(rot(dd,ax,rr(.4,.8))),L*rr(.65,.85),r*.7,depth-1); } }
    else ends.push({p:q,d:dd});
  }
  for(let k=0;k<(o.trunks||1);k++){ const az=R()*TAU; br(add(base,[Math.cos(az)*.02*k,0,Math.sin(az)*.02*k]),nrm([Math.cos(az)*.25,1,Math.sin(az)*.25]),o.L,o.r,o.depth); }
  let ytop=base[1]; for(const s of segs) for(const p of s) ytop=Math.max(ytop,p.p[1]); for(const e of ends) ytop=Math.max(ytop,e.p[1]+o.ball*2.5);
  const H=ytop-base[1]; const swA=h=>o.sway*Math.pow(sat01((h-base[1])/H),1.6);
  const stem=mixc(o.stem,o.c0,.45);
  for(const s of segs) tube(s.map(p=>({p:p.p,r:p.r*.8,c:[...mixc(tint(stem,.85),stem,sat01((p.p[1]-base[1])/H)),0],sw:swA(p.p[1])})),6,ph,6,true);
  for(const e of ends){ const nb=o.balls||7; for(let b=0;b<nb;b++){
      const off=[(R()-.5)*o.ball*3,R()*o.ball*2.4,(R()-.5)*o.ball*3]; const c=add(e.p,off);
      const col=jit(mixc(o.c0,o.c1,R()),.12);
      sphere(c,o.ball*rr(.75,1.2),1,[...col,1],[6,swA(c[1]),ph,o.glow||0],5,4,.25,R()*9); } }
  aoPiece(base[1],base[1]+H*.6,.6);
  fit(base);
  used.push([x,z,o.foot||.1]);
}

/* ---------- sea whips: long thin waving rods ---------- */
function whips(x,z,o){
  const g=seat(x,z,.03); begin(); const base=[x,g.m-.01,z];
  for(let k=0;k<o.n;k++){ const a=R()*TAU; const bx=x+Math.cos(a)*.02*k, bz=z+Math.sin(a)*.02*k; const by=groundAt(bx,bz)-.015;
    const L=o.L*rr(.65,1.1), ph=R()*TAU; let d=nrm([Math.cos(a)*rr(.05,.3),1,Math.sin(a)*rr(.05,.3)]); let q=[bx,by,bz]; const pts=[];
    const steps=Math.round(L/.025); const col=jit(o.c,.12);
    for(let i=0;i<=steps;i++){ const t=i/steps; pts.push({p:q,r:o.r*(1-.55*t),c:[...mixc(tint(col,.75),col,t),t],sw:o.sway*Math.pow(t,1.6),e:sstep(.8,1,t)*(o.glow||0)});
      d=nrm(add(d,[(R()-.5)*.12,0,(R()-.5)*.12])); q=add(q,mul(d,L/steps)); }
    tube(pts,1,ph,6,true); }

/* ---------- finger leather coral (Sinularia) ---------- */
function fingers(x,z,o){
  const g=seat(x,z,o.R*.8); const by=Math.min(g.c,g.m+.01); begin(); const c0=[x,by,z]; const ph=R()*TAU, sd=R()*30;
  grid(36,8,true,(u,v)=>{ const th=u*TAU, ph2=v*1.75; const d=[Math.sin(ph2)*Math.cos(th),Math.cos(ph2),Math.sin(ph2)*Math.sin(th)];
    const k=1+.35*(n3(d[0]*2+sd,d[1]*2,d[2]*2)-.5); return {p:add(c0,[d[0]*o.R*k,d[1]*o.H*k,d[2]*o.R*k]),c:[...tint(o.c,.8),0],q:[6,0,ph,0]}; },p=>sub(p,[c0[0],c0[1]-.02,c0[2]]));
  for(let k=0;k<o.n;k++){ const a=R()*TAU, rho=Math.sqrt(R())*o.R*.75; const bx=x+Math.cos(a)*rho, bz=z+Math.sin(a)*rho; const by2=by+o.H*.6*(1-rho/o.R);
    const L=o.L*rr(.6,1.2), r=o.fr*rr(.8,1.2); let d=nrm([Math.cos(a)*rho/o.R*.8,1,Math.sin(a)*rho/o.R*.8]); const pts=[]; let q=[bx,by2,bz];
    for(let i=0;i<=4;i++){ const t=i/4; pts.push({p:q,r:r*(1-.15*t),c:[...mixc(o.c,o.tip,t*t),t],sw:o.sway*t*t}); d=nrm(add(d,[(R()-.5)*.3,.1,(R()-.5)*.3])); q=add(q,mul(d,L/4)); }
    tube(pts,6,ph+k,6,true); }
  aoPiece(by,by+o.H+o.L,.6);
  fit(c0);
  used.push([x,z,o.R]);
}

/* ---------- anemone body (tentacles are instanced, below) ---------- */
const TENT=[];   // root xyz, len | dir xyz, radius | col rgb, phase | tip rgb, kind
function anemone(x,z,o){
  const g=seat(x,z,o.rd*.7); const by=Math.min(g.c,g.m+.01)-.01; begin(); const ph=R()*TAU;
  const hc=o.hc, rc=o.rd*.62;
  const colAt=v=>[...mixc(tint(o.col,.6),o.col,v),0];
  grid(40,7,true,(u,v)=>{ const th=u*TAU; const r=mix(rc,o.rd,Math.pow(v,2.2))*(1+.05*Math.sin(th*5+ph)); const y=by+hc*v;
    return {p:[x+Math.cos(th)*r,y,z+Math.sin(th)*r],c:colAt(v),q:[6,0,ph,0]}; },p=>[p[0]-x,0,p[2]-z]);
  const discY=rho=>by+hc+.012*(1-rho*rho)*-.6;
  grid(40,7,true,(u,v)=>{ const th=u*TAU, rho=1-v; const r=o.rd*rho*(1+.05*Math.sin(th*5+ph));
    return {p:[x+Math.cos(th)*r,discY(rho),z+Math.sin(th)*r],c:[...o.disc,rho],q:[7,0,ph,0],uv:[u,rho]}; },()=>[0,1,0]);
  used.push([x,z,o.rd+o.tl*.6]);
  const n=o.n;
  for(let k=0;k<n;k++){ const f=(k+.5)/n; const rho=.22+.76*Math.sqrt(f); const th=k*2.39996323+R()*.2;
    const r=o.rd*rho; const root=[x+Math.cos(th)*r,discY(rho)-.004,z+Math.sin(th)*r];
    const out=[Math.cos(th),0,Math.sin(th)]; const d=nrm(add(mul(out,.25+1.1*rho),[0,1.35-.5*rho,0]));
    const L=o.tl*(.7+.35*R())*(1.05-.3*rho);
    const c=jit(o.tc,.08), t=jit(o.tt,.08);
    TENT.push(root[0],root[1],root[2],L, d[0],d[1],d[2],o.tr*(.8+.4*R()), c[0],c[1],c[2],th*.6+R()*1.2, t[0],t[1],t[2],o.kind); }
}

/* ---------- small scatter ---------- */
function starfish(x,z,o){ const n=groundN(x,z); const y=groundAt(x,z); const c0=[x,y-.003,z]; begin();
  const rt=nrm(cross(n,[0,0,1])), fw=cross(rt,n), rotA=R()*TAU, sd=R()*20, Rr=o.R;
  const shape=a=>Rr*(.30+.70*Math.pow(.5+.5*Math.cos(5*(a+rotA)),1.6))*(1+.1*(n3(Math.cos(a)*2+sd,Math.sin(a)*2,1)-.5));
  grid(90,6,true,(u,v)=>{ const a=u*TAU, rho=1-v; const e=shape(a)*rho; const hgt=o.H*Math.sqrt(Math.max(0,1-rho*rho))*(.4+.6*shape(a)/Rr)+.002;
    const p=add(add(add(c0,mul(rt,Math.cos(a)*e)),mul(fw,Math.sin(a)*e)),mul(n,hgt));
    return {p,c:[...mixc(o.c,tint(o.c,1.2),rho),0],q:[1,0,0,0]}; },p=>add(sub(p,c0),mul(n,.002)));
  used.push([x,z,Rr*.7]); }
function urchin(x,z,o){ const y=groundAt(x,z); const c0=[x,y+o.r*.45,z]; begin();
  sphere(c0,o.r,.8,[...o.c,0],[0,0,0,0],14,8,.1,R()*9);
  for(let k=0;k<o.n;k++){ const u=R()*2-1, a=R()*TAU; const d=nrm([Math.sqrt(1-u*u)*Math.cos(a),Math.abs(u)*.9+.1,Math.sqrt(1-u*u)*Math.sin(a)]);
    const L=o.L*rr(.6,1.1); const p0=add(c0,mul(d,o.r*.8));
    tube([{p:p0,r:o.sr,c:[...o.sc,0]},{p:add(p0,mul(d,L)),r:o.sr*.15,c:[...tint(o.sc,1.3),1],e:o.glow||0}],0,0,4,false); }
  used.push([x,z,o.r+.02]); }
function conch(x,z,o){ const y=groundAt(x,z); begin(); const yaw=R()*TAU; const pts=[]; const turns=3.2, S=48;
  for(let i=0;i<=S;i++){ const t=i/S; const a=t*turns*TAU; const rad=o.R*Math.pow(.32,t*turns/1.2); const ax=o.R*1.6*(t-.3);
    const lp=[Math.cos(a)*rad,Math.sin(a)*rad*.9,ax]; const p=[x+lp[0]*Math.cos(yaw)-lp[2]*Math.sin(yaw), y+o.R*.6+lp[1], z+lp[0]*Math.sin(yaw)+lp[2]*Math.cos(yaw)];
    const str=.5+.5*Math.sin(t*60); pts.push({p,r:rad*.62,c:[...mixc(o.c,o.c2,str*.6),0]}); }
  tube(pts,8,0,9,true); used.push([x,z,o.R*1.4]); }
function scallop(x,z,o){ const y=groundAt(x,z); begin(); const yaw=R()*TAU, c0=[x,y,z];
  grid(24,6,false,(u,v)=>{ const a=(u-.5)*2.2, rho=.08+.92*v; const rib=.003*Math.cos(u*TAU*8); const e=o.R*rho*(1+.04*Math.cos(u*TAU*8));
    const lx=Math.sin(a)*e, lz=Math.cos(a)*e-o.R*.45; const h=o.R*.35*(1-rho*rho*.8)+rib;
    return {p:[x+lx*Math.cos(yaw)-lz*Math.sin(yaw), y+h-.004, z+lx*Math.sin(yaw)+lz*Math.cos(yaw)],c:[...mixc(o.c,o.c2,.5+.5*Math.cos(u*TAU*8)),0],q:[0,0,0,0]}; },p=>sub(p,[x,y-.05,z]));
  used.push([x,z,o.R]); }
function pebble(x,z,o){ const y=groundAt(x,z); sphere([x,y+o.r*.15,z],o.r,rr(.45,.7),[...o.c,0],[0,0,0,0],8,5,.35,R()*9); }

const GRASS=[];
function tuft(x,z,o){ const n=o.n; const y=groundAt(x,z);
  for(let k=0;k<n;k++){ const a=R()*TAU, rho=Math.sqrt(R())*o.R; const bx=x+Math.cos(a)*rho, bz=z+Math.sin(a)*rho; const by=groundAt(bx,bz)-.004;
    const d=nrm([Math.cos(a)*rr(.1,.45),1,Math.sin(a)*rr(.1,.45)]); const L=o.L*rr(.55,1.15); const c=jit(o.c,.2), t=jit(o.t,.15);
    GRASS.push(bx,by,bz,L, d[0],d[1],d[2],o.w*rr(.7,1.2), c[0],c[1],c[2],R()*TAU, t[0],t[1],t[2],1); } }

function zoas(x,z,o){ begin(); const ph=R()*TAU;
  for(let k=0;k<o.n;k++){ const a=R()*TAU, rho=Math.sqrt(R())*o.R; const px=x+Math.cos(a)*rho, pz=z+Math.sin(a)*rho;
    const gy=groundAt(px,pz); const n=groundN(px,pz); const r=o.r*rr(.75,1.2), h=o.h*rr(.6,1.3);
    const b=[px,gy-.004,pz], t=add(b,mul(nrm(add(n,[0,.6,0])),h));
    const cc=jit(o.col,.1), ce=jit(o.edge,.1), cm=jit(o.mid,.1);
    tube([{p:b,r:r*.8,c:[...cc,0]},{p:t,r:r,c:[...tint(cc,1.2),0]}],6,ph,5,false);
    const up=nrm(sub(t,b)), u1=perp(up), u2=cross(up,u1);
    grid(8,1,true,(u,v)=>{ const th=u*TAU, rr2=r*1.25*(1-v); const p=add(add(add(t,mul(u1,Math.cos(th)*rr2)),mul(u2,Math.sin(th)*rr2)),mul(up,.002*(1-v*v)));
      return {p,c:[...mixc(ce,cm,v),1-v],q:[7,0,ph,.9],uv:[u,(1-v)*.9+.1]}; },()=>up); }
  used.push([x,z,o.R*.6]); }

<script>
/* set piece: ext_glass.js */
/* ext_glass: the front glass cracks at hit1, then shatters toward the viewer at hit2.
   Cracks: instanced ribbons on the glass plane (front hook) + a frosted crush zone + flying chips.
   Shards: a radial-fracture tessellation of the pane (same lines as the cracks), extruded glass plates,
           closed-form ballistic flight; shadow (room pass, stippled = partial glass shadow), then a
           multiply pass (tint, absorption) and an additive pass (Fresnel reflection, bevels) in the blend hook.
   Spray: instanced lit billboards (droplets, bubbles, foam sheets, mist) driven out of the opening. */
window.FILM_EXT=window.FILM_EXT||[];
window.FILM_EXT.push(function(ctx){
'use strict';
const gl=ctx.gl, EV=ctx.EV, dm=ctx.dims(), TW=dm.TW, TH=dm.TH, EZ=ctx.EZ;
const T1=EV.hit1, T2=EV.hit2;
const I1=[0.02,0.12], I2=[0.0,0.12];
const G=1.75;                      // shard gravity, units/s^2 (cinematic, slightly slowed)
const HGL=0.012;                  // glass thickness
const PI2=Math.PI*2;
const hyp=Math.hypot;

/* ======================= fracture pattern (pure JS, deterministic) ======================= */
const R=ctx.rng(7301);
const NR=17, RINGS=[0,.032,.07,.12,.19,.29,.42,.59,.81,1.08,1.42,1.85,2.4], M=RINGS.length-1, SUB=3;
const th0=[], ph=[];
for(let k=0;k<NR;k++){ th0.push(PI2*k/NR+(R()-.5)*.5*(PI2/NR)+.23); ph.push(R()*6.28); }

    const th=th0[k]+.075*Math.sin(j*.9+ph[k])+(R()-.5)*.035, r=RINGS[j]*(1+(R()-.5)*.24);
    row.push({x:I1[0]+r*Math.cos(th), y:I1[1]+r*Math.sin(th), th, r}); }

    const dx=b.x-a.x, dy=b.y-a.y, L=hyp(dx,dy), nx=-dy/L, ny=dx/L;
    for(let s=1;s<SUB;s++){ const u=s/SUB+(R()-.5)*.12, off=(R()-.5)*.22*L/SUB;

    if((da<0&&db>0)||(da>0&&db<0)){ const u=da/(da-db); out.push([a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]); } }

    let p=[];
    for(let m=j*SUB;m<=(j+1)*SUB;m++) p.push(Q[k][m]);
    for(const a of AR[j+1][k]) p.push(a);
    for(let m=(j+1)*SUB;m>=j*SUB;m--) p.push(Q[k1][m]);
    if(j>0){ const ar=AR[j][k]; for(let i=ar.length-1;i>=0;i--) p.push(ar[i]); } else p.pop();
    p=clipHalf(p,1,0,TW); p=clipHalf(p,-1,0,TW); p=clipHalf(p,0,1,TH); p=clipHalf(p,0,-1,TH);
    if(p.length<3) continue; const ac=areaC(p); if(Math.abs(ac.a)<2e-6) continue;

const pieces=[];
function amax(r){ return .0011+.085*Math.pow(Math.min(1,Math.max(0,(r-.05)/1.3)),1.5); }

  const r=hyp(ac.cx-I1[0],ac.cy-I1[1]);

    let bx=0,by=0,bl=0; for(const q of p){ const dx=q[0]-ac.cx, dy=q[1]-ac.cy, l=dx*dx+dy*dy; if(l>bl){bl=l;bx=dx;by=dy;} }
    let ang=Math.atan2(by,bx)+(R()-.5)*1.1; const nx=Math.cos(ang), ny=Math.sin(ang);
    const d=nx*ac.cx+ny*ac.cy+(R()-.5)*.25*Math.sqrt(a);

const segs=[]; // [ax,ay,bx,by, ta,tb,w0,w1, seed,kind]
const RC=ctx.rng(4411);

  const q=Q[k], rt=new Array(q.length).fill(Infinity); rt[0]=T1;
  let m=0, t=T1;
  const m0=SUB*(2+Math.floor(RC()*4))+Math.floor(RC()*SUB);     // initial burst reach
  const fast=22+10*RC();
  while(m<m0 && m<q.length-1){ t+=segLen(q[m],q[m+1])/fast; m++; rt[m]=t; }
  // creeping jumps, denser toward hit2
  const nj=3+Math.floor(RC()*5), js=[];
  for(let i=0;i<nj;i++) js.push(T1+.12+2.3*Math.pow(RC(),.55));
  js.sort((a,b)=>a-b);
  for(const tj of js){ t=Math.max(t,tj); const n=1+Math.floor(RC()*RC()*5), sp=5+6*RC();
    for(let i=0;i<n && m<q.length-1;i++){ t+=segLen(q[m],q[m+1])/sp; m++; if(t<T2-.01) rt[m]=t; else break; } }
  reachT.push(rt);
  for(let mm=0;mm<q.length-1;mm++){ if(!(rt[mm+1]<T2)) break;
    const a=q[mm], b=q[mm+1]; if(!inPane(a)) break;
    const ra=hyp(a[0]-I1[0],a[1]-I1[1]), rb=hyp(b[0]-I1[0],b[1]-I1[1]);
    const wf=r=>.00055+.0016*Math.exp(-r/.3);

  float qr=fract(vUV.x*8.+.0625); float dots=exp(-pow((qr-.5)/.03,2.)-pow((v-.97)/.018,2.));
  float spark=step(.93,hash21(floor(vec2(vUV.x*90.,v*26.))+uSeed))*smoothstep(.4,.9,v)*(.5+.5*sin(uTime*5.+vUV.x*300.));
  vec3 white=mix(uCol,vec3(1.),.45);
  vec3 e=uCol*(.07*tex+.75*fres*tex+.10*(1.-v)) + white*(.55*canal*tex+.9*ring) + mix(uCol,vec3(1.),.25)*1.5*rim + white*2.4*dots + white*.6*spark*(1.-fc*.5);
  float k=(uSide<0.? .55 : 1.)*uVis*(.68+.6*uCon)*uBr;
  float al=(.03+.20*fres)*uVis;

}`;
  const GON_VS=JU+`layout(location=0) in vec2 aUV; out vec3 vW; out vec2 vP; out vec3 vAtt;
void main(){
  float rho=aUV.x, a=aUV.y*6.2831853, c=uCon;
  float rad=.56*(1.-.22*c);
  vec3 l=vec3(rho*rad*cos(a), .16+.12*c+.07*(1.-rho*rho), rho*rad*sin(a))*uR;
  vW=toW(l); vP=vec2(cos(a),sin(a))*rho; vAtt=attW(vW);
  gl_Position=uVP*vec4(vW,1.);
}`;
  const GON_FS=`uniform vec3 uCol; uniform float uCon,uVis,uBr,uSeed; in vec3 vW; in vec2 vP; in vec3 vAtt; out vec4 o;
void main(){
  if(uMirror>.5 && vW.z>0.) discard;
  float g=0.;
  for(int k=0;k<4;k++){ float an=float(k)*1.5707963+.7853982; vec2 cn=.47*vec2(cos(an),sin(an));
    float dd=length(vP-cn); vec2 dir=(vP-cn)/max(dd,1e-3);

  float grain=.75+.5*vnoise(vP*30.+uSeed);
  float mouth=exp(-dot(vP,vP)/.012)*.8;
  vec3 c=mix(uCol,vec3(1.,.88,1.),.30);
  float k=uVis*(.7+.6*uCon)*uBr;
  o=vec4(c*(g*grain*1.15+mouth)*k*vAtt, (g*.18+mouth*.1)*uVis);
}`;
  const RIB_VS=JU+`layout(location=0) in vec4 aR; uniform vec3 uSpine[${NK}];
out vec3 vW; out vec2 vSS; out float vKind; out float vA; out vec3 vAtt; out float vId;
vec3 spine(float s){ float f=clamp(s,0.,1.)*${NK-1}.; int i=int(min(floor(f),${NK-2}.)); float w=f-float(i); return mix(uSpine[i],uSpine[i+1],w); }
float h1(float x){ return fract(sin(x*127.1+uSeed*31.7)*43758.5453); }
vec3 strand(float id, float s, float kind, out float wd){
  if(kind<.5){
    float ang=(id+.5)/uNT*6.2831853+.18*(h1(id)-.5);
    vec3 rd=uB1*cos(ang)+uB2*sin(ang);
    vec3 root=uC+uAx*(uR*-.30)+rd*uR*(.96-.40*uCon);
    float L=uR*uLen*(.45+1.0*h1(id+7.));
    float ph=uTime*(1.5+.6*h1(id+3.))+id*1.7;
    vec3 p=root+spine(s)*L;
    p+=rd*uR*.45*s*(1.-.45*s)*(1.-.5*uCon);
    p+=(uB1*sin(s*7.-ph)+uB2*cos(s*5.3-ph*.8+id))*uR*.22*s;
    wd=.0026*(1.-.55*s);
    return p;
  } else {
    float sub=kind-1.;
    float ang=id*1.5707963+.7853982+.20*(sub-1.);
    vec3 rd=uB1*cos(ang)+uB2*sin(ang), rt=uB1*-sin(ang)+uB2*cos(ang);
    vec3 root=uC+uAx*(uR*-.12)+rd*uR*.07;
    float L=uR*uLen*.36*(.85+.3*h1(id+11.));
    float ph=uTime*.9+id*2.1;
    vec3 p=root+spine(s*.95)*L;
    p+=rd*uR*.25*s*(1.-.3*s);
    p+=(uB1*sin(s*4.-ph)+uB2*cos(s*3.4-ph*.8+id))*uR*.30*s;
    float tw=s*9.+sub*2.1-uTime*1.4+id;
    p+=(rd*cos(tw)+rt*sin(tw))*uR*.10*(.3+.7*s)*sin(s*14.+sub*1.7-uTime*2.);
    wd=uR*.11*(1.-.55*s)*(.55+.45*sin(s*26.+sub*2.3+id));
    return p;
  }
}
void main(){
  float id=aR.x, s=aR.y, side=aR.z, kind=aR.w;
  float wd, wd1;
  vec3 p=strand(id,s,kind,wd), p1=strand(id,min(s+.01,1.),kind,wd1), p0=strand(id,max(s-.01,0.),kind,wd1);
  vec3 T=normalize(p1-p0+1e-6), E=uEye-p; vec3 sd=normalize(cross(T,E)+1e-6);
  float dz=max(uEye.z-p.z,.2); float wpx=wd*uPx/dz; float a=1.;
  if(wpx<1.1){ a=wpx/1.1; wd=1.1*dz/uPx; }
  vW=p+sd*wd*side; vSS=vec2(s,side); vKind=kind; vA=a; vAtt=attW(vW); vId=id;
  gl_Position=uVP*vec4(vW,1.);
}`;
  const RIB_FS=`uniform vec3 uCol; uniform float uVis,uCon,uBr; in vec3 vW; in vec2 vSS; in float vKind; in float vA; in vec3 vAtt; in float vId; out vec4 o;
void main(){
  if(uMirror>.5 && vW.z>0.) discard;
  float s=vSS.x, x=vSS.y; vec3 c; float al;
  if(vKind<.5){
    float prof=exp(-x*x*3.);
    float bead=pow(.5+.5*sin(s*110.-uTime*4.+vId*5.),14.)*smoothstep(.02,.2,s)*(1.-s);
    c=mix(uCol,vec3(1.),.22)*(.95*exp(-1.6*s)+1.1*bead)*prof;
    al=.22*prof*exp(-1.6*s);
  } else {
    float edge=smoothstep(.35,.95,abs(x));
    float ruf=.5+.5*sin(s*70.+x*2.5+vId*1.3+uTime*1.5);
    float fall=(1.-.65*s)*smoothstep(1.,.92,s);
    c=mix(uCol,vec3(1.,.9,1.),.18)*(.38+1.1*edge*ruf)*fall*(1.-smoothstep(.9,1.,abs(x)));
    al=.14*fall;
  }
  float k=uVis*(.72+.55*uCon)*uBr*vA;
  o=vec4(c*k*vAtt, al*vA*uVis);
}`;
  const PL_VS=`layout(location=0) in vec4 aS; layout(location=1) in float aT;
uniform vec3 uJT[${NJ*NL}]; uniform vec4 uJV[${NJ}]; uniform vec3 uJC[${NJ}]; uniform float uPx,uZS,uNt;
out vec3 vCol; out float vA;
float hh(float x){ return fract(sin(x*91.37)*43758.5453); }
vec3 trail(int j, float lag){ float f=clamp(lag,0.,1.)*${NL-1}.; int i=int(min(floor(f),${NL-2}.)); float w=f-float(i); return mix(uJT[j*${NL}+i],uJT[j*${NL}+i+1],w); }
float wv(float t,float x,float z){ float ph=(x+1.6)*.42-z*.05; return exp(-pow((t-53.0-ph)/.32,2.))+.8*exp(-pow((t-55.9-ph)/.36,2.)); }
void main(){
  float t=uTime, w=aS.w; int ty=int(aT+.5);
  vec3 p; float b; vec3 col=mix(vec3(.18,1.0,.78),vec3(.25,.70,1.0),hh(w*3.1));
  float tw=.30+.70*pow(.5+.5*sin(t*(1.7+3.3*hh(w*5.7))+w*91.),3.);
  float sz=.0035+.0055*hh(w*7.3);
  if(ty==0){
    // slow eddies through the whole tank
    vec3 q=vec3((aS.x*2.-1.)*${(TW-.04).toFixed(3)}, (aS.y*2.-1.)*${(TH-.03).toFixed(3)}, -.15-aS.z*5.2);
    int e=int(hh(w*2.3)*3.);
    vec2 cn=e==0? vec2(-.75,-2.4) : e==1? vec2(.70,-3.8) : vec2(.15,-1.2);
    vec2 r=q.xz-cn; float rl=length(r); float an=t*(.10/(.25+rl))*(e==1? -1.:1.)+.25*sin(t*.3+w*20.);
    float cs=cos(an), sn=sin(an); r=vec2(r.x*cs-r.y*sn, r.x*sn+r.y*cs);
    p=vec3(cn.x+r.x, q.y+.05*sin(t*.4+w*13.)+.02*sin(t*1.3+w*7.), cn.y+r.y);
    b=.42*tw;
    if(abs(p.x)>${(TW-.02).toFixed(3)} || p.z>-.03 || p.z<-5.45 || p.y>${(TH-.01).toFixed(3)}) b=0.;
  } else if(ty==1){
    // wakes: sparks shed along each jelly's path, spreading and fading
    int j=int(min(hh(w*4.1)*${NJ}.,${NJ-1}.));
    if(hh(w*8.9)<.35) j=6+int(min(hh(w*6.7)*3.,2.));
    float lag=pow(hh(w*3.7),1.4);
    vec3 c=trail(j,lag);
    vec3 dir=normalize(vec3(hh(w*1.1)-.5,hh(w*1.9)-.5,hh(w*2.7)-.5)+1e-4);
    float an=t*.5+w*30.; dir.xz=vec2(dir.x*cos(an)-dir.z*sin(an), dir.x*sin(an)+dir.z*cos(an));
    float rad=(uJV[j].y*(.7+.8*hh(w*6.1))+.32*lag*hh(w*9.3)+.05)*(c.z>0.? .55 : 1.);
    p=c+dir*rad+vec3(0.,-.10*lag,0.);
    b=uJV[j].x*(.30+.55*exp(-lag*3.))*(1.-lag)*tw; sz*=.65;
    col=mix(col,uJC[j],.15);
    if(p.z<0. && (abs(p.x)>${(TW-.02).toFixed(3)} || p.y>${(TH-.01).toFixed(3)} || p.y<${(-TH+.01).toFixed(3)})) b=0.;
  } else {
    // glints on the water surface, lit by the jellies below
    p=vec3((aS.x*2.-1.)*${(TW-.05).toFixed(3)}, ${(TH-.004).toFixed(3)}, -.1-aS.z*5.3);
    vec3 L=vec3(0.);
    for(int j=0;j<${NJ};j++){ vec3 d=uJT[j*${NL}]-p; if(uJT[j*${NL}].z<0.) L+=uJC[j]*uJV[j].x/(1.+9.*dot(d,d)); }
    float gl=pow(.5+.5*sin(t*(3.+4.*hh(w*2.2))+w*60.+p.x*9.),18.);
    b=gl*1.6; col=L; sz=.006+.006*hh(w*5.5);
  }
  // sparks light up as a jelly passes them, and with the light wave
  if(ty!=2){ float ex=0.; for(int j=0;j<${NJ};j++){ vec3 d=uJT[j*${NL}]-p; ex+=uJV[j].x*exp(-dot(d,d)/(.02+uJV[j].y*uJV[j].y*1.5)); }
    b*=1.+1.3*ex; b*=1.+1.4*wv(t,p.x,p.z); }
  if(uZS*p.z<0.) b=0.;
  float wl=p.z<0.? length(p-uEye)*(-p.z)/(uEye.z-p.z) : 0.;
  vec3 att=exp(-uFog.x*1.6*wl*vec3(1.75,1.,.86));
  float d=max(uEye.z-p.z,.2);

}`;
  const PL_FS=`in vec3 vCol; in float vA; out vec4 o;
void main(){ vec2 q=gl_PointCoord*2.-1.; float r2=dot(q,q); float a=exp(-r2*5.)+.25*exp(-r2*1.5); o=vec4(vCol*a*vA*1.6,0.); }`;

  const PB=ctx.prog(BELL_VS,BELL_FS), PG=ctx.prog(GON_VS,GON_FS), PR=ctx.prog(RIB_VS,RIB_FS), PP=ctx.prog(PL_VS,PL_FS);

  /* ---------------- geometry ---------------- */
  function grid(nu,nv){ const v=[]; for(let i=0;i<nu;i++) for(let k=0;k<nv;k++){ const u0=i/nu,u1=(i+1)/nu,v0=k/nv,v1=(k+1)/nv;
      v.push(u0,v0,u1,v0,u1,v1, u0,v0,u1,v1,u0,v1); } return new Float32Array(v); }
  const bellVAO=gl.createVertexArray(); gl.bindVertexArray(bellVAO);
  const bellData=grid(112,30); ctx.buf(bellData); ctx.attr(0,2,8,0); const bellN=bellData.length/2;
  // gonad disk: (rho, angle)
  const gonVAO=gl.createVertexArray(); gl.bindVertexArray(gonVAO);
  const gd=[]; { const nr=14, na=72; for(let k=0;k<nr;k++) for(let i=0;i<na;i++){ const r0=k/nr,r1=(k+1)/nr,a0=i/na,a1=(i+1)/na; gd.push(r0,a0,r1,a0,r1,a1, r0,a0,r1,a1,r0,a1); } }
  ctx.buf(new Float32Array(gd)); ctx.attr(0,2,8,0); const gonN=gd.length/2;
  // ribbons: tentacles (kind 0, up to 28) then four oral arms with three frilled sheets each (kind 1..3)
  const rb=[]; const seg=(id,ns,kind)=>{ for(let k=0;k<ns;k++){ const s0=k/ns,s1=(k+1)/ns; rb.push(id,s0,-1,kind, id,s0,1,kind, id,s1,1,kind, id,s0,-1,kind, id,s1,1,kind, id,s1,-1,kind); } };
  const NS_T=40, NS_A=56;
  for(let k=0;k<4;k++) for(let sub=0;sub<3;sub++) seg(k,NS_A,1+sub);
  const armVerts=rb.length/4;
  for(let i=0;i<28;i++) seg(i,NS_T,0);
  const ribVAO=gl.createVertexArray(); gl.bindVertexArray(ribVAO); ctx.buf(new Float32Array(rb)); ctx.attr(0,4,16,0);
  const tentPer=NS_T*6;
  // plankton: 4200 ambient, 2600 wake (some go out into the room), 700 surface glints
  const N0=4200, N1=2600, N2=700, NPL=N0+N1+N2;
  const pl=new Float32Array(NPL*5); { const r=ctx.rng(90210); for(let i=0;i<NPL;i++){ pl[i*5]=r(); pl[i*5+1]=r(); pl[i*5+2]=r(); pl[i*5+3]=r()*10+i*.0137; pl[i*5+4]=i<N0?0:i<N0+N1?1:2; } }
  const plVAO=gl.createVertexArray(); gl.bindVertexArray(plVAO); ctx.buf(pl); ctx.attr(0,4,20,0); ctx.attr(1,1,20,16);
  gl.bindVertexArray(null);

  /* ---------------- drawing ---------------- */
  const order=[0,1,2,3,4,5,6,7,8];
  let lastT=-1e9;
  function prep(t){ const tt=ctx.state.time; if(tt!==lastT){ update(tt); lastT=tt; order.sort((a,b)=>S[b].d-S[a].d); } }
  function setJ(u,i){ const j=J[i], s=S[i];
    gl.uniform3fv(u.uC,s.c); gl.uniform3fv(u.uAx,s.ax); gl.uniform3fv(u.uB1,s.b1); gl.uniform3fv(u.uB2,s.b2); gl.uniform3fv(u.uCol,j.col);
    gl.uniform1f(u.uR,j.R); gl.uniform1f(u.uCon,s.con); gl.uniform1f(u.uSeed,j.seed); gl.uniform1f(u.uVis,s.vis); gl.uniform1f(u.uBr,s.br);
    gl.uniform1f(u.uLen,j.len); gl.uniform1f(u.uNT,j.nt); gl.uniform1f(u.uPx,PX); }
  function drawJelly(i){ const j=J[i], s=S[i]; if(s.vis<.003) return;
    let u;
    gl.blendFuncSeparate(gl.ONE,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE);
    // far side of the bell (seen through the near side)
    u=ctx.common(PB); setJ(u,i); gl.uniform1f(u.uSide,-1); gl.bindVertexArray(bellVAO); gl.drawArrays(gl.TRIANGLES,0,bellN);
    // tentacles and oral arms hang inside and below
    u=ctx.common(PR); setJ(u,i); gl.uniform3fv(u.uSpine,s.spine); gl.bindVertexArray(ribVAO);
    gl.drawArrays(gl.TRIANGLES,0,armVerts+tentPer*j.nt);
    // gonads, then the near side of the bell
    u=ctx.common(PG); setJ(u,i); gl.bindVertexArray(gonVAO); gl.drawArrays(gl.TRIANGLES,0,gonN);
    u=ctx.common(PB); setJ(u,i); gl.uniform1f(u.uSide,1); gl.bindVertexArray(bellVAO); gl.drawArrays(gl.TRIANGLES,0,bellN);
  }
  const jt=new Float32Array(NJ*NL*3), jv=new Float32Array(NJ*4), jc=new Float32Array(NJ*3);
  function drawPlankton(side){
    for(let i=0;i<NJ;i++){ jt.set(S[i].trail,i*NL*3); jv[i*4]=S[i].vis*S[i].br; jv[i*4+1]=J[i].R; jc.set(J[i].col,i*3); }
    gl.blendFuncSeparate(gl.ONE,gl.ONE,gl.ZERO,gl.ONE);
    const u=ctx.common(PP); gl.uniform3fv(u.uJT,jt); gl.uniform4fv(u.uJV,jv); gl.uniform3fv(u.uJC,jc);
    gl.uniform1f(u.uPx,PX); gl.uniform1f(u.uZS,side); gl.uniform1f(u.uNt,ctx.state.night);

  }
  const live=()=>ctx.state.night>.002;

  return {
    name:'night',
    lights(t){
      if(!(ctx.state.night>.002)) return;
      prep(t);
      // three room jellies first, then the four strongest in the tank
      const pick=[6,7,8].concat([0,1,2,3,4,5].sort((a,b)=>S[b].vis*J[b].R/(1+.25*S[b].d)-S[a].vis*J[a].R/(1+.25*S[a].d)).slice(0,4));

    },
    blend(pass,t){
      if(!live()) return; prep(t);
      drawPlankton(-1);
      for(const i of order) if(S[i].c[2]<=0) drawJelly(i);
    },
    front(pass,t){
      if(!live()) return; prep(t);
      drawPlankton(1);
      for(const i of order) if(S[i].c[2]>0) drawJelly(i);
      gl.blendFuncSeparate(gl.ONE,gl.ONE,gl.ZERO,gl.ONE);
    }
  };
});

</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('stage');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance'});
function fail(msg){ const d=document.createElement('div'); d.className='fail'; d.textContent=msg; document.body.appendChild(d); }
if(!gl){ fail('This page needs WebGL 2. Please open it in a current browser.'); return; }

/* ---------- small maths ---------- */
const sat = x => Math.min(1, Math.max(0, x));
const ss = (a,b,x) => { const t=sat((x-a)/(b-a)); return t*t*(3-2*t); };
const mix = (a,b,t) => a+(b-a)*t;
function rng(seed){ let a=seed>>>0; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- world constants (one unit is about 10 cm on a laptop) ---------- */
const EZ = 5.0;      // viewer's eye, in front of the glass
const D  = 5.5;      // tank depth behind the glass
let A=1.6, TW=1.4, TH=0.82, FR=0.075, WM=0.1, XS=1;   // set in resize()

/* ---------- shaders ---------- */
const HEAD = `#version 300 es
precision highp float;
uniform mat4 uVP; uniform vec3 uEye; uniform float uTime;
uniform vec3 uTank;   // half width, half height, depth
uniform vec4 uFog;    // density, water level, sun, unused
uniform vec2 uFocus;  // 1/focus distance, strength
uniform float uXs;
uniform mat4 uSunVP; uniform mat4 uRoomVP; uniform highp sampler2DShadow uSunMap; uniform highp sampler2DShadow uRoomMap; uniform float uShOn; uniform float uFlood;
uniform float uMirror; uniform vec2 uRes; uniform sampler2D uMirTex;
uniform vec4 uGlow[8]; uniform vec3 uGlowCol[8]; uniform float uNight;
`;
const FCOMMON = `
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.; a*=.5; } return s; }
float caust(vec2 uv){
  float t=uTime*.45+23.;
  vec2 p=mod(uv*6.28318530718,6.28318530718)-250.;
  vec2 i=p; float c=1.; const float inten=.005;
  for(int n=0;n<4;n++){ float tt=t*(1.-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten))); }
  c/=4.; c=1.17-pow(c,1.4); return min(pow(abs(c),8.),1.6);

/* ---------- the cut: film seconds to show seconds ---------- */
// cold open (the money shot), a cut, then the show from flat to flood with the slow parts tightened
const WARP=[[0,41.3],[3.0,44.3],[3.0,0.0],[5.2,3.6],[9.6,9.6],[12.2,12.6],[16.0,18.0],[19.0,22.0],[23.0,26.5],[31.0,36.0],[43.5,48.5],[61.5,66.5]];
const TOTAL=65*FPS, SHUTTER=.5, APERTURE=+(qs.get('ap')||.024);

/* ---------- drive: the page renders, the harness collects ---------- */
simInit();
const pix=new Uint8Array(W*H*4);
function grab(){ gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pix); return pix; }
async function post(path, body){ const r=await fetch(path,{method:'POST',body:(body instanceof Uint8Array)? new Blob([body]) : body}); await r.text(); if(!r.ok) throw new Error(path+' '+r.status); }
const SMP=+(qs.get('S')||32);
window.__film={ renderFrame, showAt, TOTAL, FPS };
(async()=>{
  try{
    if(qs.has('film')){ const a=+(qs.get('from')||0), b=+(qs.get('to')||TOTAL);
      for(let i=a;i<b;i++){ renderFrame(i,SMP); await post('/frame?i='+i, grab()); }
      await post('/done','ok'); }
    else if(qs.has('stills')){ for(const s of qs.get('stills').split(',')){ const i=+s; renderFrame(i,SMP); await post('/still?i='+i, grab()); }
      await post('/done','ok'); }
    else if(LIVE){
      // live preview: plays the film in real time at low sample counts. Space pauses, arrows scrub, 1 to 4 set samples.
      let tau=+(qs.get('at')||0), last=performance.now(), paused=false, S=+(qs.get('S')||1), fpsAvg=0; const t0=last;
      const hud=document.createElement('div'); hud.style.cssText='position:fixed;left:12px;top:10px;font:600 13px/1.3 ui-monospace,Menlo,monospace;color:#dff;background:rgba(0,10,14,.55);padding:6px 9px;border-radius:8px;z-index:5;white-space:pre';
      document.body.appendChild(hud);
      window.addEventListener('keydown',e=>{ const k=e.key;
        if(k===' '){ paused=!paused; e.preventDefault(); }
        else if(k==='ArrowRight') tau=Math.min(TOTAL/FPS-.02,tau+(e.shiftKey?10:2));
        else if(k==='ArrowLeft') tau=Math.max(0,tau-(e.shiftKey?10:2));
        else if(k==='r'||k==='R') tau=0;
        else if(k>='1'&&k<='4') S=[1,4,8,16][+k-1]; });
      canvas.addEventListener('click',()=>{ paused=!paused; });
      const loop=now=>{ const dt=Math.min(.1,(now-last)/1000); last=now; if(!paused) tau+=dt; if(tau>=TOTAL/FPS) tau=0;
        renderFrame(tau*FPS,S); fpsAvg+=((1/Math.max(dt,1e-3))-fpsAvg)*.05;
        // slow machine: reload once at a lighter size
        if(!qs.has('w') && now-t0>6000 && now-t0<7000 && fpsAvg<18){ location.replace(location.pathname+'?w=852'); return; }
        hud.textContent='film '+tau.toFixed(1)+' s of '+(TOTAL/FPS)+'   show '+showAt(tau)[0].toFixed(1)+' s   '+fpsAvg.toFixed(0)+' fps   samples '+S+(paused?'   PAUSED':'')+'\nspace: pause   arrows: scrub 2 s (shift 10 s)   R: restart   1-4: quality';
        requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    else renderFrame(+(qs.get('f')||0),SMP);
  }catch(err){ console.error(err); try{ await fetch('/error',{method:'POST',body:String(err&&err.stack||err)}); }catch(_){} }
})();
})();
